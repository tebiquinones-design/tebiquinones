<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Past Collabs — Tebi Quiñones</title>
<meta name="description" content="Casas y escenarios que han confiado en Tebi Quiñones: hoteles, clubes y teatros de Madrid, París y Londres — Le Grand Mazarin, NH Collection, Casa Suecia, Silencio, The Scotch y más.">
<link rel="canonical" href="https://tebiquinones.com/collabs">
<style>
  /* ============================================================
     PAST COLLABS · logotipos planos en movimiento
     Marcas blancas flotando sobre negro, sin cajas — dos cintas
     marquee en direcciones opuestas. Hecha para vivir sola y
     como Embed (Framer / iframe). El movimiento corre SIEMPRE.
     ============================================================ */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #08080A;
    color: #EDE8DC;
    font-family: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
    overflow-x: hidden;
  }
  .vitrina { padding: clamp(1.8rem, 4vw, 3rem) 0 clamp(2.2rem, 5vw, 3.6rem); }
  .rotulo {
    text-align: center;
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #C9A45C;
    margin: 0 1rem clamp(1.8rem, 4.5vw, 3rem);
  }
  .rotulo span { color: #8B8577; }

  .cinta { overflow: hidden; }
  .cinta + .cinta { margin-top: clamp(2rem, 4.5vw, 3.2rem); }
  .fila {
    display: flex;
    align-items: center;
    gap: clamp(2.4rem, 5vw, 4.5rem);
    width: max-content;
    padding-inline: clamp(1.2rem, 2.5vw, 2.25rem);
    animation: rodar 70s linear infinite;
  }
  .fila.reversa { animation: rodar 84s linear infinite reverse; }
  .fila:hover { animation-play-state: paused; }
  @keyframes rodar { to { transform: translateX(-50%); } }

  .fila img {
    height: clamp(26px, 4vw, 44px);
    width: auto;
    display: block;
    opacity: 0.92;
    transition: opacity 0.3s ease;
  }
  .fila img.alta { height: clamp(44px, 7vw, 76px); }
  .fila img:hover { opacity: 1; }
</style>
</head>
<body>

<section class="vitrina" aria-label="Colaboraciones de Tebi Quiñones">
  <p class="rotulo">Past Collabs <span>· Madrid — París — Londres — Bogotá</span></p>

  <div class="cinta">
    <div class="fila">
      <img class="alta" src="/collabs-img/flat/le-grand-mazarin.png" alt="Le Grand Mazarin, París Le Marais">
      <img src="/collabs-img/flat/nh-collection.png" alt="NH Collection Hotels &amp; Resorts">
      <img src="/collabs-img/flat/casa-suecia.png" alt="Casa Suecia, Madrid">
      <img src="/collabs-img/flat/silencio.png" alt="Silencio, París">
      <img class="alta" src="/collabs-img/flat/the-scotch.png" alt="The Scotch of St. James, Londres">
      <img class="alta" src="/collabs-img/flat/hotel-marquise.png" alt="Hotel Marquise">
      <img class="alta" src="/collabs-img/flat/b-london.png" alt="B London">
      <img src="/collabs-img/flat/victoria-paris.png" alt="Victoria, París">
      <img src="/collabs-img/flat/larc-paris.png" alt="L'Arc, París">
      <img src="/collabs-img/flat/alma-paris.png" alt="Alma, París">
      <img class="alta" src="/collabs-img/flat/the-door.png" alt="The Door Boutique Club">
      <img src="/collabs-img/flat/panthera.png" alt="Panthera Dinner &amp; Dance">
      <!-- duplicado para el loop -->
      <img class="alta" src="/collabs-img/flat/le-grand-mazarin.png" alt="" aria-hidden="true">
      <img src="/collabs-img/flat/nh-collection.png" alt="" aria-hidden="true">
      <img src="/collabs-img/flat/casa-suecia.png" alt="" aria-hidden="true">
      <img src="/collabs-img/flat/silencio.png" alt="" aria-hidden="true">
      <img class="alta" src="/collabs-img/flat/the-scotch.png" alt="" aria-hidden="true">
      <img class="alta" src="/collabs-img/flat/hotel-marquise.png" alt="" aria-hidden="true">
      <img class="alta" src="/collabs-img/flat/b-london.png" alt="" aria-hidden="true">
      <img src="/collabs-img/flat/victoria-paris.png" alt="" aria-hidden="true">
      <img src="/collabs-img/flat/larc-paris.png" alt="" aria-hidden="true">
      <img src="/collabs-img/flat/alma-paris.png" alt="" aria-hidden="true">
      <img class="alta" src="/collabs-img/flat/the-door.png" alt="" aria-hidden="true">
      <img src="/collabs-img/flat/panthera.png" alt="" aria-hidden="true">
    </div>
  </div>

  <div class="cinta">
    <div class="fila reversa">
      <img src="/collabs-img/flat/florida-park.png" alt="Florida Park, Madrid">
      <img class="alta" src="/collabs-img/flat/teatro-barcelo.png" alt="Teatro Barceló, Madrid">
      <img src="/collabs-img/flat/hipodromo-zarzuela.png" alt="Hipódromo de la Zarzuela, Madrid">
      <img src="/collabs-img/flat/ramses.png" alt="Ramses, Madrid">
      <img src="/collabs-img/flat/goya-social-club.png" alt="Goya Social Club, Madrid">
      <img class="alta" src="/collabs-img/flat/istar.png" alt="Istar">
      <img class="alta" src="/collabs-img/flat/lula-club.png" alt="Lula Club, Madrid">
      <img class="alta" src="/collabs-img/flat/marieta.png" alt="Marieta, Madrid">
      <img class="alta" src="/collabs-img/flat/los-amantes.png" alt="Los Amantes">
      <img src="/collabs-img/flat/jomo.png" alt="Jomo">
      <img class="alta" src="/collabs-img/flat/studio-1111.png" alt="Studio 1111">
      <!-- duplicado para el loop -->
      <img src="/collabs-img/flat/florida-park.png" alt="" aria-hidden="true">
      <img class="alta" src="/collabs-img/flat/teatro-barcelo.png" alt="" aria-hidden="true">
      <img src="/collabs-img/flat/hipodromo-zarzuela.png" alt="" aria-hidden="true">
      <img src="/collabs-img/flat/ramses.png" alt="" aria-hidden="true">
      <img src="/collabs-img/flat/goya-social-club.png" alt="" aria-hidden="true">
      <img class="alta" src="/collabs-img/flat/istar.png" alt="" aria-hidden="true">
      <img class="alta" src="/collabs-img/flat/lula-club.png" alt="" aria-hidden="true">
      <img class="alta" src="/collabs-img/flat/marieta.png" alt="" aria-hidden="true">
      <img class="alta" src="/collabs-img/flat/los-amantes.png" alt="" aria-hidden="true">
      <img src="/collabs-img/flat/jomo.png" alt="" aria-hidden="true">
      <img class="alta" src="/collabs-img/flat/studio-1111.png" alt="" aria-hidden="true">
    </div>
  </div>
</section>

</body>
</html>
